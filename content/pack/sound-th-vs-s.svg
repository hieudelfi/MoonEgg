<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3F8CFF"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#3B2E2A" font-family="Arial">Cặp âm dễ nhầm: /θ/ và /s/</text>
<text x="350" y="30" font-size="12" fill="#9A8C84" font-family="Arial" text-anchor="middle">Nhìn thẳng (miệng phóng to)</text>
<text x="670" y="30" font-size="12" fill="#9A8C84" font-family="Arial" text-anchor="middle">Mặt cắt nghiêng (vị trí lưỡi)</text>
<text x="20" y="78" font-size="34" font-weight="700" fill="#3B2E2A" font-family="Arial">/θ/</text><text x="20" y="108" font-size="16" fill="#3B2E2A" font-family="Arial">think · thank · bath</text><text x="20" y="134" font-size="12" fill="#9A8C84" font-family="Arial">Vô thanh. Lỗi hay gặp:</text><text x="20" y="152" font-size="12" fill="#9A8C84" font-family="Arial">đọc thành /t/ hoặc /s/</text><g transform="translate(200,50)"><rect width="300" height="220" rx="16" fill="#F6D9C4" stroke="#E7DED4"/><path d="M30,100 Q150,60 270,100 Q150,170 30,100 Z" fill="#7A2F3A" stroke="#3B2E2A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M30,100 Q150,50 270,100" fill="none" stroke="#E8877A" stroke-width="14"/><path d="M30,100 Q150,60 270,100" fill="none" stroke="#3B2E2A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M60,96 L240,96 L236,118 L64,118 Z" fill="#FFFFFF" stroke="#3B2E2A" stroke-width="3"/><line x1="84" y1="96" x2="84" y2="118" stroke="#3B2E2A" stroke-width="2"/><line x1="110" y1="96" x2="110" y2="118" stroke="#3B2E2A" stroke-width="2"/><line x1="136" y1="96" x2="136" y2="118" stroke="#3B2E2A" stroke-width="2"/><line x1="162" y1="96" x2="162" y2="118" stroke="#3B2E2A" stroke-width="2"/><line x1="188" y1="96" x2="188" y2="118" stroke="#3B2E2A" stroke-width="2"/><line x1="214" y1="96" x2="214" y2="118" stroke="#3B2E2A" stroke-width="2"/><path d="M105,118 Q150,92 195,118 Q150,140 105,118 Z" fill="#E06B7C" stroke="#B84A5C" stroke-width="3"/><path d="M120,122 Q150,110 180,122" fill="none" stroke="#B84A5C" stroke-width="2"/><path d="M70,132 L230,132 L226,148 L74,148 Z" fill="#FFFFFF" stroke="#3B2E2A" stroke-width="3"/><path d="M30,100 Q150,170 270,100" fill="none" stroke="#E8877A" stroke-width="14"/><path d="M30,100 Q150,170 270,100" fill="none" stroke="#3B2E2A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(520,50)"><rect width="300" height="220" rx="16" fill="#FFF9F2" stroke="#E7DED4"/><path d="M60,30 Q150,10 250,40 L250,200 L60,200 Q40,150 60,30 Z" fill="#F6D9C4" stroke="#3B2E2A" stroke-width="3"/><path d="M75,105 Q130,60 230,80 L230,180 L90,180 Z" fill="#7A2F3A" opacity=".9"/><path d="M75,105 Q130,60 230,80" fill="none" stroke="#F0C9B5" stroke-width="6"/><text x="180" y="72" font-size="11" fill="#9A8C84" font-family="Arial">vòm miệng</text><path d="M78,100 L96,100 L94,124 L82,124 Z" fill="#FFFFFF" stroke="#3B2E2A" stroke-width="2.5"/><path d="M80,150 L98,150 L96,132 L84,132 Z" fill="#FFFFFF" stroke="#3B2E2A" stroke-width="2.5"/><path d="M230,175 Q150,150 100,140 Q78,130 62,126 Q80,118 100,124 Q160,130 230,150 Z" fill="#E06B7C" stroke="#B84A5C" stroke-width="3"/><path d="M38,124 L10,124" stroke="#3F8CFF" stroke-width="4" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="8" y="108" font-size="11" fill="#3F8CFF" font-family="Arial">hơi</text><path d="M62,95 Q70,100 78,100" fill="none" stroke="#C9605A" stroke-width="5"/><path d="M64,152 Q70,150 80,150" fill="none" stroke="#C9605A" stroke-width="5"/><circle cx="70" cy="126" r="9" fill="none" stroke="#2A9D5A" stroke-width="3"/><text x="150" y="238" text-anchor="middle" font-size="13" fill="#2A9D5A" font-family="Arial" font-weight="700">Đầu lưỡi kẹp nhẹ giữa hai hàm răng, thổi hơi</text></g>
<text x="20" y="328" font-size="34" font-weight="700" fill="#3B2E2A" font-family="Arial">/s/</text><text x="20" y="358" font-size="16" fill="#3B2E2A" font-family="Arial">sink · sun · bus</text><text x="20" y="384" font-size="12" fill="#9A8C84" font-family="Arial">Lưỡi ở SAU răng,</text><text x="20" y="402" font-size="12" fill="#9A8C84" font-family="Arial">không thò ra. Tiếng rít nhọn</text><g transform="translate(200,300)"><rect width="300" height="220" rx="16" fill="#F6D9C4" stroke="#E7DED4"/><path d="M25,105 Q150,75 275,105 Q150,145 25,105 Z" fill="#7A2F3A" stroke="#3B2E2A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M25,105 Q150,68 275,105" fill="none" stroke="#E8877A" stroke-width="12"/><path d="M25,105 Q150,75 275,105" fill="none" stroke="#3B2E2A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M55,100 L245,100 L241,116 L59,116 Z" fill="#FFFFFF" stroke="#3B2E2A" stroke-width="3"/><line x1="79" y1="100" x2="79" y2="116" stroke="#3B2E2A" stroke-width="2"/><line x1="105" y1="100" x2="105" y2="116" stroke="#3B2E2A" stroke-width="2"/><line x1="131" y1="100" x2="131" y2="116" stroke="#3B2E2A" stroke-width="2"/><line x1="157" y1="100" x2="157" y2="116" stroke="#3B2E2A" stroke-width="2"/><line x1="183" y1="100" x2="183" y2="116" stroke="#3B2E2A" stroke-width="2"/><line x1="209" y1="100" x2="209" y2="116" stroke="#3B2E2A" stroke-width="2"/><line x1="235" y1="100" x2="235" y2="116" stroke="#3B2E2A" stroke-width="2"/><path d="M60,118 L240,118 L236,132 L64,132 Z" fill="#FFFFFF" stroke="#3B2E2A" stroke-width="3"/><path d="M25,105 Q150,145 275,105" fill="none" stroke="#E8877A" stroke-width="12"/><path d="M25,105 Q150,145 275,105" fill="none" stroke="#3B2E2A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(520,300)"><rect width="300" height="220" rx="16" fill="#FFF9F2" stroke="#E7DED4"/><path d="M60,30 Q150,10 250,40 L250,200 L60,200 Q40,150 60,30 Z" fill="#F6D9C4" stroke="#3B